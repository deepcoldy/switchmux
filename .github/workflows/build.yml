name: release

# Signed + notarized releases. Runs ONLY for tags pushed by a maintainer to
# the main line. Pull requests — including forks — never see any secrets and
# are never signed: GitHub only injects secrets when the workflow file itself
# comes from the repository's default branch AND the ref is a trusted tag.
on:
  push:
    tags:
      - "v*"          # formal release: v1.2.3
      - "v*-canary"    # canary: e.g. v1.2.3-canary.1
  workflow_dispatch:    # manual (maintainer only, runs from main)

# A fork/PR workflow cannot set or read these protected environment values;
# jobs that need credentials declare `environment: release`, which is locked
# to required reviewers if you choose to enable branch protection later.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: SwitchMux
  BUNDLE_ID: dev.shenhan.switchmux
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  # Hard guard: refuse to run the signing pipeline anywhere but a trusted tag
  # on the canonical repository, regardless of how the run was started.
  gate:
    name: Gate (trusted tag + owner)
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.g.outputs.allowed }}
    steps:
      - id: g
        run: |
          set -euo pipefail
          REF="${GITHUB_REF}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          ALLOWED=false
          # Only the repo owner's account, and only a release tag.
          if [ "$OWNER" = "deepcoldy" ] && echo "$REF" | grep -Eq '^refs/tags/v[0-9].*$'; then
            ALLOWED=true
          fi
          # workflow_dispatch on a branch is allowed for owner too.
          if [ "$OWNER" = "deepcoldy" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ALLOWED=true
          fi
          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          echo "Ref: $REF  Owner: $OWNER  Event: ${{ github.event_name }}  Allowed: $ALLOWED"

  build-sign-notarize:
    name: Build, sign, notarize and release
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: macos-15
    # Secrets are only referenced inside this protected job. GitHub never
    # provides them to pull_request/fork contexts even if code changes here.
    environment: release
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install asc
        run: brew install asc

      - name: Authenticate with App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_CERT_BASE64: ${{ secrets.ASC_DEVELOPER_ID_CERT_P12 }}
          ASC_CERT_PASSWORD: ${{ secrets.ASC_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .asc-work
          printf '%s' "$ASC_PRIVATE_KEY" > .asc-work/AuthKey.p8
          chmod 600 .asc-work/AuthKey.p8
          printf '%s' "$ASC_CERT_PASSWORD" > .asc-work/p12.pass
          printf '%s' "$ASC_CERT_BASE64" | base64 -d > .asc-work/DeveloperID.p12
          asc auth login --name ci \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-key ".asc-work/AuthKey.p8" \
            --bypass-keychain --network

      - name: Build universal binaries
        run: |
          set -euo pipefail
          mkdir -p build/obj
          find Sources -not -path "*/CaptureHelper/*" -name '*.swift' | sort > /tmp/app-sources.txt
          find Sources/CaptureHelper -name '*.swift' | sort > /tmp/helper-sources.txt
          swiftc -O -target arm64-apple-macos${MACOSX_DEPLOYMENT_TARGET} -swift-version 5 \
            $(cat /tmp/app-sources.txt) -o build/obj/SwitchMux-arm64
          swiftc -O -target x86_64-apple-macos${MACOSX_DEPLOYMENT_TARGET} -swift-version 5 \
            $(cat /tmp/app-sources.txt) -o build/obj/SwitchMux-x86_64
          swiftc -O -target arm64-apple-macos${MACOSX_DEPLOYMENT_TARGET} -swift-version 5 \
            $(cat /tmp/helper-sources.txt) -o build/obj/Helper-arm64
          swiftc -O -target x86_64-apple-macos${MACOSX_DEPLOYMENT_TARGET} -swift-version 5 \
            $(cat /tmp/helper-sources.txt) -o build/obj/Helper-x86_64
          lipo -create build/obj/SwitchMux-arm64 build/obj/SwitchMux-x86_64 -o build/obj/SwitchMux
          lipo -create build/obj/Helper-arm64 build/obj/Helper-x86_64 -o build/obj/SwitchMuxCaptureHelper

      - name: Assemble .app and icon
        run: |
          set -euo pipefail
          APP="build/$APP_NAME.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/obj/SwitchMux "$APP/Contents/MacOS/SwitchMux"
          cp build/obj/SwitchMuxCaptureHelper "$APP/Contents/MacOS/SwitchMuxCaptureHelper"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          swift scripts/make_icon.swift build/icon_1024.png
          ICONSET=build/AppIcon.iconset
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          sips -z 16 16   build/icon_1024.png --out "$ICONSET/icon_16x16.png"       >/dev/null
          sips -z 32 32   build/icon_1024.png --out "$ICONSET/icon_16x16@2x.png"   >/dev/null
          sips -z 32 32   build/icon_1024.png --out "$ICONSET/icon_32x32.png"      >/dev/null
          sips -z 64 64   build/icon_1024.png --out "$ICONSET/icon_32x32@2x.png"  >/dev/null
          sips -z 128 128 build/icon_1024.png --out "$ICONSET/icon_128x128.png"    >/dev/null
          sips -z 256 256 build/icon_1024.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 build/icon_1024.png --out "$ICONSET/icon_256x256.png"    >/dev/null
          sips -z 512 512 build/icon_1024.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 build/icon_1024.png --out "$ICONSET/icon_512x512.png"    >/dev/null
          cp build/icon_1024.png "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

      - name: Sign with Developer ID
        run: |
          set -euo pipefail
          APP="build/$APP_NAME.app"
          KC="$(pwd)/.asc-work/signing.keychain-db"
          KCPASS="$(openssl rand -hex 32)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security list-keychain -s "$KC" login.keychain-db
          # G2 intermediate is required for the leaf cert to form a valid identity.
          curl -fsSL -o .asc-work/DeveloperIDG2CA.cer \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import .asc-work/DeveloperIDG2CA.cer -k "$KC"
          security import .asc-work/DeveloperID.p12 -k "$KC" -P "$(cat .asc-work/p12.pass)" \
            -T /usr/bin/codesign -T /usr/bin/security -A
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY"
          codesign --force --options runtime --timestamp --keychain "$KC" \
            --sign "$IDENTITY" "$APP/Contents/MacOS/SwitchMuxCaptureHelper"
          codesign --force --options runtime --timestamp --keychain "$KC" \
            --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create and sign DMG
        run: |
          set -euo pipefail
          KC="$(pwd)/.asc-work/signing.keychain-db"
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          hdiutil create -volname "$APP_NAME" -srcfolder "build/$APP_NAME.app" \
            -ov -format UDZO "build/$APP_NAME.dmg"
          codesign --force --timestamp --keychain "$KC" --sign "$IDENTITY" "build/$APP_NAME.dmg"

      - name: Notarize and staple
        run: |
          set -euo pipefail
          asc notarization submit --file "build/$APP_NAME.dmg" --wait
          # Use Apple's stapler directly: asc's staple re-check after writing
          # falsely reports the artifact changed and exits non-zero.
          xcrun stapler staple "build/$APP_NAME.dmg"
          xcrun stapler validate "build/$APP_NAME.dmg"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APP_NAME }}.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-canary') }}

      - name: Scrub credentials
        if: always()
        run: rm -rf .asc-work
